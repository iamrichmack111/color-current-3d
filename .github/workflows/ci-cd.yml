name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          node --check game.js
          python -m py_compile scripts/capture_screenshots.py
          test -s index.html
          test -s style.css

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Generate Playwright screenshots
        run: python scripts/capture_screenshots.py

      - name: Verify screenshot gallery
        run: |
          test -s media/screenshots/01-start-screen.png
          test -s media/screenshots/02-live-reef.png
          test -s media/screenshots/03-color-catch.png
          test -s media/screenshots/04-level-progress.png
          test -s media/screenshots/05-reef-giant.png

      - name: Upload Playwright gallery
        uses: actions/upload-artifact@v4
        with:
          name: color-current-3d-playwright-screenshots
          path: media/screenshots/*.png
          if-no-files-found: error
